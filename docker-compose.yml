# Local platform for the Olist pipeline.
#
# The production path runs against AWS (S3 + Glue + Athena) with credentials from .env:
#   docker compose up -d prefect-server
#   docker compose run --rm pipeline python flows/olist_flow.py
#   docker compose run --rm dbt dbt build
#
# Postgres (the Airbyte source) and MinIO (an offline S3 stand-in) sit behind profiles, so
# neither starts unless asked for:
#   docker compose --profile airbyte up -d postgres
#   docker compose --profile minio up -d minio minio-init
#
services:
  # Offline S3 stand-in. Not part of the production path; kept so the pipeline can be run
  # end-to-end without an AWS account.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["minio"]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/olist-raw local/olist-silver local/olist-gold &&
      echo 'buckets ready'
      "
    profiles: ["minio"]

  # The fictional operational system Airbyte reads from.
  # Published on 55432 because another PostgreSQL already owns 5432 on this host.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist_source
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # COPY runs server-side, so the CSVs must be visible inside this container.
      - ./data/source:/data/source:ro
      - ./sql/postgres:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist -d olist_source"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["airbyte"]

  prefect-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect

  # Spark jobs and Prefect flows. No depends_on: start whatever you need yourself, so a run
  # never drags an unrelated service up with it.
  # Defaults target MinIO. Copy .env.example to .env to point the same image at AWS S3
  # (compose reads .env automatically), or override per run with `-e NAME=value`.
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      SOURCE_DIR: /data/source
      DQ_REPORT_DIR: /data/reports
      LAKE_RAW: ${LAKE_RAW:-s3a://olist-raw}
      LAKE_SILVER: ${LAKE_SILVER:-s3a://olist-silver}
      LAKE_GOLD: ${LAKE_GOLD:-s3a://olist-gold}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION-}
      GLUE_DATABASE_SILVER: ${GLUE_DATABASE_SILVER:-olist_silver}
      GLUE_DATABASE_GOLD: ${GLUE_DATABASE_GOLD:-olist_gold}
      DBT_S3_STAGING_DIR: ${DBT_S3_STAGING_DIR-}
      DBT_S3_DATA_DIR: ${DBT_S3_DATA_DIR-}
      ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-olist}
      AIRBYTE_API_URL: ${AIRBYTE_API_URL-}
      AIRBYTE_CLIENT_ID: ${AIRBYTE_CLIENT_ID-}
      AIRBYTE_CLIENT_SECRET: ${AIRBYTE_CLIENT_SECRET-}
      AIRBYTE_CONNECTION_ID: ${AIRBYTE_CONNECTION_ID-}
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
    volumes:
      - ./data:/data
      - ./src:/app/src
      - ./flows:/app/flows
      - ./tests:/app/tests
      - ivy-cache:/root/.ivy2
      - ./dbt:/dbt
      - ./soda:/app/soda

  # dbt lives in its own image: its dependencies downgrade packages Prefect needs.
  dbt:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    working_dir: /dbt
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION-}
      DBT_S3_STAGING_DIR: ${DBT_S3_STAGING_DIR-}
      DBT_S3_DATA_DIR: ${DBT_S3_DATA_DIR-}
      GLUE_DATABASE_SILVER: ${GLUE_DATABASE_SILVER:-olist_silver}
      GLUE_DATABASE_GOLD: ${GLUE_DATABASE_GOLD:-olist_gold}
      ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-olist}
    volumes:
      - ./dbt:/dbt

volumes:
  minio-data:
  postgres-data:
  prefect-data:
  ivy-cache:
# Local platform: MinIO (S3-compatible lake), Postgres (future Airbyte source), Prefect server,
# and the pipeline image that runs Spark jobs and flows.
#
#   docker compose up -d minio minio-init prefect-server
#   docker compose run --rm pipeline python flows/olist_flow.py
#
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/olist-raw local/olist-silver local/olist-gold &&
      echo 'buckets ready'
      "

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist_source
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles: ["airbyte"]   # only needed once Airbyte is added (phase 5)

  prefect-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      SOURCE_DIR: /data/source
      DQ_REPORT_DIR: /data/reports
      LAKE_RAW: ${LAKE_RAW:-s3a://olist-raw}
      LAKE_SILVER: ${LAKE_SILVER:-s3a://olist-silver}
      LAKE_GOLD: ${LAKE_GOLD:-s3a://olist-gold}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION-}
      GLUE_DATABASE_SILVER: ${GLUE_DATABASE_SILVER:-olist_silver}
      GLUE_DATABASE_GOLD: ${GLUE_DATABASE_GOLD:-olist_gold}
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
    volumes:
      - ./data:/data
      - ./src:/app/src
      - ./flows:/app/flows
      - ./tests:/app/tests
      - ivy-cache:/root/.ivy2
    depends_on:
      - minio-init
      - prefect-server

volumes:
  minio-data:
  postgres-data:
  prefect-data:
  ivy-cache:

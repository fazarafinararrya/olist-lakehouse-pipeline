name: olist_gold
version: "1.0.0"
config-version: 2

# Which profile in profiles.yml to use for the connection.
profile: olist

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  olist_gold:
    # Gold tables are read over and over by BI tools, so materialise them as real
    # Parquet tables in S3 rather than as views that re-scan silver on every query.
    +materialized: table
    +format: parquet

    # Where the table files land. Setting this on the profile alone was not enough: the adapter
    # wrote them under the Athena query-result location instead, which carries a 7-day expiry
    # rule, so the tables would have disappeared a week after being built while their
    # definitions stayed in the Glue catalog.
    +s3_data_dir: "{{ env_var('DBT_S3_DATA_DIR') }}"
    +s3_data_naming: schema_table

    dimensions:
      +tags: ["dimension"]
    facts:
      +tags: ["fact"]